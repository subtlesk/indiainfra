name: Build & deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 5 * *" # monthly: re-run build (and later, fetch refresh)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pdfplumber
      # Build strictly from the committed raw archive — CI must never depend on
      # flaky government servers. Fetching new files is a manual/scheduled task
      # that commits into data/raw/ first.
      - name: Build chain dataset (invariants fail the build)
        run: python -m pipeline.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
